name: Journal du bac

# Relève les dernières nouvelles des projets et met à jour data/journal.json.
on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 heures
  workflow_dispatch: {}       # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths:
      - data/journal-manuel.json
      - data/sources.json
      - outils/maj.py

permissions:
  contents: write
  pages: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter les nouvelles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 outils/maj.py
      - name: Enregistrer et republier si quelque chose a changé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/journal.json; then
            echo "Rien de neuf."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journal.json
          git commit -m "Journal : nouvelles des projets"
          git push
          # un commit fait par le robot ne relance pas toujours Pages : on le demande
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
